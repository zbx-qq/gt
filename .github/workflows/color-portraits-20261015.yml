name: Genuine color portrait correction
on:
  push:
    branches: [asset-pack-20261015]
    paths:
      - '.github/workflows/color-portraits-20261015.yml'
      - 'portrait_color_fix.py'
  workflow_dispatch:
concurrency:
  group: genuine-color-avatar-pack
  cancel-in-progress: true
jobs:
  generate-color-portrait-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow "numpy<2" "opencv-python-headless==4.10.0.84"
      - name: Verify face detector
        run: python -c "import cv2; assert hasattr(cv2, 'CascadeClassifier'); assert not cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml').empty(); print('Face detection is enabled')"
      - name: Collect real color portraits
        run: python -u portrait_color_fix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-color-portrait-pack
          path: |
            output/*_genuine_color_portraits.zip
            output/color_manifest.json
          if-no-files-found: warn
          retention-days: 7
